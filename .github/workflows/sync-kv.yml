name: Sync price hotspots to EdgeOne KV

on:
  workflow_dispatch:

concurrency:
  group: price-sync-kv
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write PRICE_KV hotspots
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
          UPDATE_KV_URL: ${{ secrets.PRICE_UPDATE_KV_URL }}
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}
        run: >-
          set -euo pipefail;
          test -n "${KV_WRITE_TOKEN}" || { echo 'Missing KV_WRITE_TOKEN'; exit 1; };
          test -n "${UPDATE_KV_URL}" || { echo 'Missing PRICE_UPDATE_KV_URL'; exit 1; };
          pip install -q cryptography;
          CN_DATE=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import crypto_price, json; j=crypto_price.load_json("data/meta/latest.json") or json.load(open("data/meta/latest.json",encoding="utf-8")); print(j["today"])');
          for spec in price_meta=data/meta/latest.json price_items=data/meta/items.json price_model_config=data/meta/model-config.json price_table_latest=data/table/latest.json price_today_snapshots=data/snapshots/${CN_DATE}.json; do
            key="${spec%%=*}";
            file="${spec#*=}";
            test -f "${file}" || { echo "Missing ${file}"; exit 1; };
            python3 -c 'import json,sys; key,path=sys.argv[1:]; value=open(path,encoding="utf-8").read(); print(json.dumps({"key":key,"value":value},ensure_ascii=False))' "${key}" "${file}" > /tmp/price-kv-payload.json;
            curl --fail --retry 3 --max-time 300 -X POST "${UPDATE_KV_URL}" -H "Authorization: Bearer ${KV_WRITE_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/price-kv-payload.json;
            rm -f /tmp/price-kv-payload.json;
          done
