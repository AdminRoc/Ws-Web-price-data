name: Validate and publish committed price release

on:
  workflow_dispatch:

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current committed data
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Verify the existing release manifest
        run: python3 scripts/build_release_manifest.py --verify

      - name: Validate all committed JSON artifacts
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob('data/**/*.json', recursive=True)
          for path in files:
              with open(path, encoding='utf-8') as source:
                  value = json.load(source)
              if isinstance(value, dict) and value.get('ct'):
                  raise SystemExit('encrypted artifact found: ' + path)
          print(f'VERIFY OK: {len(files)} committed JSON files')
          PY

      - name: Verify pinned raw files and publish the small pointer
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: python3 scripts/publish_release_pointer.py
