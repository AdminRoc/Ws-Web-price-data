name: 抓取快照并聚合日均价

# 每 2 小时(UTC 第 15 分)运行一次:
#   1) 抓取全量均价快照 → 追加进当日批次文件 data/snapshots/YYYY-MM-DD.json
#   2) 聚合前一日(UTC+8)日均价 → data/daily/ + data/series/(幂等,每天只会真正聚合一次)
#   3) 重建表格 bundle(data/table/latest.json,含今日临时均价与预测)+ meta
#   4) 清理过期文件(snapshots 7 天 / daily+series 1000 天)
#   5) 有变动提交;jsDelivr purge 立即生效
# 站点优先读取 wfspeed-price 的 EdgeOne KV，公开数据仓用于回退和历史保留。

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */2 * * *" # 每 2 小时第 15 分(UTC);脚本内另有 0~3min 随机延迟错峰

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_DIR: data
      DATA_REVISION: ${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: pip install aiohttp -q

      - name: 抓取全量快照
        run: python3 scripts/fetch_snapshots.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 聚合日均价并重建 bundle(幂等)
        run: python3 scripts/aggregate_daily.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 校验明文数据与核心结构
        run: |
          python3 -c "
          import glob, json, sys
          files = glob.glob('data/**/*.json', recursive=True)
          bad = []
          for p in files:
            try:
              obj = json.load(open(p, encoding='utf-8'))
              if isinstance(obj, dict) and obj.get('ct'):
                bad.append(p+': encrypted wrapper')
            except Exception as e:
              bad.append(p+': '+str(e))
          if bad:
              print('VERIFY FAIL:' + '\n'.join(bad)); sys.exit(1)
          print(f'VERIFY OK: {len(files)} json files')
          "

      - name: 生成本次运行摘要
        run: >-
          python3 -c 'import json, os; m=json.load(open("data/meta/latest.json",encoding="utf-8")); s="### Price data summary\n"+"".join(f"- {k}: {m.get(k)}\n" for k in ("today","snapshot_batches_today","daily_count","total_items","table_items")); print(s,end=""); p=os.environ.get("GITHUB_STEP_SUMMARY"); open(p,"a",encoding="utf-8").write(s) if p else None'

      - name: 提交并推送
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无变动,跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: 均价快照批次 + 日均价聚合 [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf /tmp/data_bak && mkdir -p /tmp/data_bak
            cp -r data/* /tmp/data_bak/ 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rm -rf data && mkdir -p data
            cp -r /tmp/data_bak/* data/ 2>/dev/null || true
            git add data/
            git commit -m "data: 均价快照批次 + 日均价聚合 [skip ci]"
            sleep "$(( (RANDOM % 4) + 2 ))"
          done
          exit 1

      # jsDelivr 的 @main 跟随最新 commit,但 CDN 缓存有延迟;提交后主动 purge 立即生效。
      # 注意:快照/日均价文件名按 UTC+8 日期键命名,purge 时也要按 UTC+8 计算。
      - name: 刷新 jsDelivr 缓存(热点文件)
        if: steps.commit.outputs.changed == 'true'
        run: |
          CN_DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          CN_YDAY=$(TZ='Asia/Shanghai' date -d 'yesterday' +%Y-%m-%d)
          for f in \
            "data/meta/items.json" \
            "data/meta/latest.json" \
            "data/table/latest.json" \
            "data/snapshots/${CN_DATE}.json" \
            "data/daily/${CN_YDAY}.json" ; do
            curl -s "https://purge.jsdelivr.net/gh/AdminRoc/Ws-Web-price-data@main/${f}" || true
          done

      - name: 写入 wfspeed-price EdgeOne KV
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KV_WRITE_TOKEN}" || { echo 'Missing KV_WRITE_TOKEN'; exit 1; }
          publish() {
            local key="$1" file="$2" payload="/tmp/${key}.json"
            test -f "$file" || { echo "Missing $file"; return 1; }
            python3 - "$key" "$file" "$payload" <<'PY'
          import json, pathlib, sys
          key, source, target = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          json.loads(value)
          pathlib.Path(target).write_text(json.dumps({'key': key, 'value': value}, ensure_ascii=False), encoding='utf-8')
          PY
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 300 \
              -X POST 'https://price.wfspeed.run/api/update-kv' \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary "@$payload"
            rm -f "$payload"
          }
          CN_DATE=$(python3 -c 'import json; print(json.load(open("data/meta/latest.json",encoding="utf-8"))["today"])')
          publish price_items data/meta/items.json
          publish price_model_config data/meta/model-config.json
          publish price_today_snapshots "data/snapshots/${CN_DATE}.json"
          publish price_table_index data/table/kv-index.json
          for part in data/table/kv/*.json; do
            key="price_table_chunk_$(basename "$part" .json)"
            publish "$key" "$part"
          done
          # Meta is published last and therefore acts as the ready marker for the frontend.
          publish price_meta data/meta/latest.json
