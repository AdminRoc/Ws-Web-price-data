name: 抓取快照并聚合日均价

# 正常情况下每 2 小时(UTC 第 15 分)运行一次；同一时刻 :45 另有一次
# stale-only 兜底。schedule 运行只在最近一次完整抓取+PRICE_KV读回成功已超过 90 分钟时执行，
# 避免延迟的 cron 或补偿槽重复追加样本；workflow_dispatch 始终可人工运行。
#   1) 抓取全量均价快照 → 追加进当日批次文件 data/snapshots/YYYY-MM-DD.json
#   2) 聚合前一日(UTC+8)日均价 → data/daily/ + data/series/(幂等,每天只会真正聚合一次)
#   3) 重建表格 bundle(data/table/latest.json,含今日临时均价与预测)+ meta
#   4) 清理过期文件(snapshots 7 天 / daily+series 1000 天)
#   5) 有变动提交;jsDelivr purge 立即生效
# 站点优先读取 wfspeed-price 的 EdgeOne KV，公开数据仓用于回退和历史保留。

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */2 * * *" # 每 2 小时第 15 分(UTC);脚本内另有 0~3min 随机延迟错峰
    - cron: "45 * * * *" # 每小时 stale-only 兜底；下方完整成功发布年龄门控避免重复采样

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_capture: ${{ steps.guard.outputs.run_capture }}
    steps:
      - name: Checkout schedule guard
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main
          sparse-checkout: |
            scripts

      - name: Gate scheduled capture on last fully published run
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          MIN_AGE_MINUTES: "90"
        run: python3 scripts/snapshot_schedule_guard.py

  fetch:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run_capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_DIR: data
      DATA_REVISION: ${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main

      - name: 安装依赖
        run: pip install aiohttp -q

      - name: 测试 item ID 连续性与历史迁移冲突保护
        run: python3 -m unittest discover -s tests -p 'test_item_identity.py' -v

      - name: 抓取全量快照
        run: python3 scripts/fetch_snapshots.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 聚合日均价并重建 bundle(幂等)
        run: python3 scripts/aggregate_daily.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 检查 price_items 的 1 MiB KV 单值上限
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('data/meta/items.json')
          size = path.stat().st_size
          limit = 1048576
          if size > limit:
              raise SystemExit(f'{path} exceeds the PRICE_KV single-value limit: {size} > {limit} bytes')
          print(f'PRICE_KV price_items size verified: {size}/{limit} bytes')
          PY

      - name: 校验明文数据与核心结构
        run: |
          python3 -c "
          import glob, json, sys
          files = glob.glob('data/**/*.json', recursive=True)
          bad = []
          for p in files:
            try:
              obj = json.load(open(p, encoding='utf-8'))
              if isinstance(obj, dict) and obj.get('ct'):
                bad.append(p+': encrypted wrapper')
            except Exception as e:
              bad.append(p+': '+str(e))
          if bad:
              print('VERIFY FAIL:' + '\n'.join(bad)); sys.exit(1)
          print(f'VERIFY OK: {len(files)} json files')
          "

      - name: 生成本次运行摘要
        run: >-
          python3 -c 'import json, os; m=json.load(open("data/meta/latest.json",encoding="utf-8")); s="### Price data summary\n"+"".join(f"- {k}: {m.get(k)}\n" for k in ("today","snapshot_batches_today","daily_count","total_items","table_items")); print(s,end=""); p=os.environ.get("GITHUB_STEP_SUMMARY"); open(p,"a",encoding="utf-8").write(s) if p else None'

      - name: 提交并推送
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无变动,跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: 均价快照批次 + 日均价聚合 [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected on attempt $i; fetching main and rebasing the single generated-data commit."
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::Could not safely rebase generated data onto main; no overwrite or publication was attempted."
              exit 1
            fi
            sleep "$(( (RANDOM % 4) + 2 ))"
          done
          exit 1

      # jsDelivr 的 @main 跟随最新 commit,但 CDN 缓存有延迟;提交后主动 purge 立即生效。
      # 注意:快照/日均价文件名按 UTC+8 日期键命名,purge 时也要按 UTC+8 计算。
      - name: 刷新 jsDelivr 缓存(热点文件)
        if: steps.commit.outputs.changed == 'true'
        run: |
          CN_DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          CN_YDAY=$(TZ='Asia/Shanghai' date -d 'yesterday' +%Y-%m-%d)
          for f in \
            "data/meta/items.json" \
            "data/meta/latest.json" \
            "data/table/latest.json" \
            "data/snapshots/${CN_DATE}.json" \
            "data/daily/${CN_YDAY}.json" ; do
            curl -s "https://purge.jsdelivr.net/gh/AdminRoc/Ws-Web-price-data@main/${f}" || true
          done

      - name: 写入 wfspeed-price EdgeOne KV
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KV_WRITE_TOKEN}" || { echo 'Missing KV_WRITE_TOKEN'; exit 1; }
          publish() {
            local key="$1"
            local file="$2"
            local payload="/tmp/${key}.json"
            test -f "$file" || { echo "Missing $file"; return 1; }
            python3 - "$key" "$file" "$payload" <<'PY'
          import json, pathlib, sys
          key, source, target = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          json.loads(value)
          pathlib.Path(target).write_text(json.dumps({'key': key, 'value': value}, ensure_ascii=False), encoding='utf-8')
          PY
            curl --silent --show-error --fail-with-body --retry 8 --retry-all-errors \
              --retry-delay 20 --retry-max-time 300 --max-time 60 \
              -X POST 'https://price.wfspeed.run/api/update-kv' \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary "@$payload"
            python3 - "$key" "$file" <<'PY'
          import hashlib, sys, urllib.request
          key, source = sys.argv[1:]
          expected = open(source, 'rb').read()
          with urllib.request.urlopen('https://price.wfspeed.run/api/kv?key=' + key, timeout=60) as response:
              actual = response.read()
          if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
              raise SystemExit('readback hash mismatch for ' + key)
          PY
            rm -f "$payload"
          }
          CN_DATE=$(python3 -c 'import json; print(json.load(open("data/meta/latest.json",encoding="utf-8"))["today"])')
          publish price_items data/meta/items.json
          publish price_model_config data/meta/model-config.json
          publish price_today_snapshots "data/snapshots/${CN_DATE}.json"
          publish price_table_index data/table/kv-index.json
          for part in data/table/kv/*.json; do
            key="price_table_chunk_$(basename "$part" .json)"
            publish "$key" "$part"
          done
          # Meta is published last and therefore acts as the ready marker for the frontend.
          publish price_meta data/meta/latest.json
