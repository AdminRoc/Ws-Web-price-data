name: 抓取快照并聚合日均价

# 正常情况下每 2 小时(UTC 第 15 分)运行一次；同一时刻 :45 另有一次
# stale-only 兜底。GitHub schedule 与明确标记的 Cloudflare hourly fallback 都使用同一
# 90 分钟完整抓取+PRICE_KV读回成功门槛；普通手动 workflow_dispatch 仍可强制运行。
#   1) 抓取全量均价快照 → 追加进当日批次文件 data/snapshots/YYYY-MM-DD.json
#   2) 聚合前一日(UTC+8)日均价 → data/daily/ + data/series/(幂等,每天只会真正聚合一次)
#   3) 重建表格 bundle(data/table/latest.json,含今日临时均价与预测)+ meta
#   4) 清理过期文件(snapshots 7 天 / daily+series 1000 天)
#   5) 提交完整数据集并仅发布 SHA 固定 raw 文件的 EdgeOne KV 指针

on:
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish and validate the already committed dataset without another upstream scrape
        type: boolean
        required: false
        default: false
      cf_schedule_fallback:
        description: Mark as the hourly Cloudflare schedule fallback
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "15 */2 * * *" # 每 2 小时第 15 分(UTC);脚本内另有 0~3min 随机延迟错峰
    - cron: "45 * * * *" # 每小时 stale-only 兜底；下方完整成功发布年龄门控避免重复采样

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_capture: ${{ steps.guard.outputs.run_capture }}
    steps:
      - name: Checkout schedule guard
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main
          sparse-checkout: |
            scripts

      - name: Gate scheduled capture on last fully published run
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          CF_SCHEDULE_FALLBACK: ${{ github.event.inputs.cf_schedule_fallback }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          MIN_AGE_MINUTES: "90"
        run: python3 scripts/snapshot_schedule_guard.py

  fetch:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run_capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_DIR: data
      DATA_REVISION: ${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main

      - name: 安装依赖
        run: pip install aiohttp -q

      - name: 测试 item ID 连续性与历史迁移冲突保护
        run: python3 -m unittest discover -s tests -p 'test_item_identity.py' -v

      - name: 抓取全量快照
        if: ${{ github.event.inputs.publish_existing != 'true' }}
        run: python3 scripts/fetch_snapshots.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 聚合日均价并重建 bundle(幂等)
        if: ${{ github.event.inputs.publish_existing != 'true' }}
        run: python3 scripts/aggregate_daily.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: Build release manifest and lazy history indexes
        if: ${{ github.event.inputs.publish_existing != 'true' }}
        run: python3 scripts/build_release_manifest.py

      - name: Verify committed release manifest
        if: ${{ github.event.inputs.publish_existing == 'true' }}
        run: python3 scripts/build_release_manifest.py --verify

      - name: 校验明文数据与核心结构
        run: |
          python3 -c "
          import glob, json, sys
          files = glob.glob('data/**/*.json', recursive=True)
          bad = []
          for p in files:
            try:
              obj = json.load(open(p, encoding='utf-8'))
              if isinstance(obj, dict) and obj.get('ct'):
                bad.append(p+': encrypted wrapper')
            except Exception as e:
              bad.append(p+': '+str(e))
          if bad:
              print('VERIFY FAIL:' + '\n'.join(bad)); sys.exit(1)
          print(f'VERIFY OK: {len(files)} json files')
          "

      - name: 生成本次运行摘要
        run: >-
          python3 -c 'import json, os; m=json.load(open("data/meta/latest.json",encoding="utf-8")); s="### Price data summary\n"+"".join(f"- {k}: {m.get(k)}\n" for k in ("today","snapshot_batches_today","daily_count","total_items","table_items")); print(s,end=""); p=os.environ.get("GITHUB_STEP_SUMMARY"); open(p,"a",encoding="utf-8").write(s) if p else None'

      - name: 仅发布已提交数据
        if: ${{ github.event.inputs.publish_existing == 'true' }}
        run: |
          git diff --quiet -- data/
          test -s data/meta/latest.json
          test -s data/meta/items.json
          test -s data/table/kv-index.json
          echo 'Validated a clean, already committed source dataset; no upstream scrape or source commit in this run.'

      - name: 提交并推送
        id: commit
        if: ${{ github.event.inputs.publish_existing != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无变动,跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: 均价快照批次 + 日均价聚合 [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected on attempt $i; fetching main and rebasing the single generated-data commit."
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::Could not safely rebase generated data onto main; no overwrite or publication was attempted."
              exit 1
            fi
            sleep "$(( (RANDOM % 4) + 2 ))"
          done
          exit 1

      - name: Verify and publish price raw release pointer
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: python3 scripts/publish_release_pointer.py