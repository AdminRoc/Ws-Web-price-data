name: Publish verified price raw release pointer

on:
  workflow_dispatch:

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current committed data
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Verify release manifest without changing data
        run: python3 scripts/build_release_manifest.py --verify

      - name: Verify pinned raw files and publish the small pointer
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: python3 scripts/publish_release_pointer.py
